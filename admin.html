<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mi Sitio Web · Trazo Web Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#1F4E79;--accent:#0e8a4f;--ink:#202229;--gray:#6b7078;--line:#e8e8ea;--soft:#f5f5f5;--green:#25D366;--red:#e74c3c;--yellow:#f0a818;--blue:#1a73e8}
body{font-family:'Inter',sans-serif;background:var(--soft);color:var(--ink)}
button{font-family:inherit;cursor:pointer}

/* NAV */
nav{background:var(--accent);color:#fff;position:sticky;top:0;z-index:50}
.nav-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.nav-in b{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav-out{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;display:none}

/* GATE */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border-radius:16px;padding:40px 32px;width:100%;max-width:380px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.gate-box h2{font-size:20px;font-weight:800;margin-bottom:6px;color:var(--accent)}
.gate-box p{font-size:13px;color:var(--gray);margin-bottom:24px}
.gate-field{text-align:left;margin-bottom:14px}
.gate-field label{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px}
.gate-field input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:13px 14px;font-size:15px;outline:none}
.gate-field input:focus{border-color:var(--accent)}
.gate-go{width:100%;background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:700;padding:14px;border-radius:9px;margin-top:6px}
.gate-go:hover{background:#0b7a44}
.gate-err{color:var(--red);font-size:12px;margin-top:10px;display:none}

/* WRAP */
.wrap{max-width:960px;margin:0 auto;padding:20px;display:none}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:#fff;border-radius:14px;padding:22px 16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1px solid var(--line)}
.stat b{font-size:28px;font-weight:800;display:block}
.stat span{font-size:10px;letter-spacing:2px;color:var(--gray);text-transform:uppercase;font-weight:600;margin-top:4px;display:block}

/* TABS */
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--line)}
.tab-btn{background:none;border:none;padding:12px 22px;font-size:14px;font-weight:600;color:var(--gray);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}

/* FILTERS */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters input{flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;background:#fff}
.filters select{border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;font-size:13px;font-family:inherit;outline:none;background:#fff;font-weight:600}

/* ORDER CARD */
.order-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:16px;border:1px solid var(--line)}
.order-card .badge{margin-bottom:12px}
.order-row{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:14px;margin-bottom:6px}
.order-row b{color:var(--gray);font-weight:600}
.order-total{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.order-total span{font-size:26px;font-weight:800}
.order-date{text-align:right;font-size:12px;color:var(--gray);margin-top:8px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:12px}
.badge.nuevo{background:#d1fae5;color:#065f46}
.badge.activo{background:#dcebff;color:#1a4f9e}
.badge.pagado{background:#d1fae5;color:#065f46}
.badge.pendiente{background:#fff3d6;color:#9a6c00}
.badge.vencido{background:#fde8e8;color:var(--red)}
.badge.cancelado{background:#f0f0f2;color:var(--gray)}

/* CLIENT CARD */
.info-grid{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:14px}
.info-grid b{color:var(--gray);font-weight:600}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray);border-bottom:2px solid var(--line)}
td{padding:12px 14px;border-top:1px solid var(--line)}

.empty{padding:40px;text-align:center;color:var(--gray);font-size:14px}

/* SUPPORT */
.support-btn{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--green);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;width:100%;justify-content:center;text-decoration:none;margin-top:20px}
.support-btn svg{width:20px;height:20px;fill:#fff}

@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .order-row,.info-grid{grid-template-columns:120px 1fr}
  .tab-btn{padding:10px 14px;font-size:13px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <b>&#128202; Administrador · Trazo Web Studio</b>
    <button class="nav-out" id="btnLogout" onclick="logout()">Salir</button>
  </div>
</nav>

<div class="gate" id="gate">
  <div class="gate-box">
    <h2>Panel de tu sitio web</h2>
    <p>Ingresa tus datos para ver el estado de tu página</p>
    <div class="gate-field">
      <label>Tu número de WhatsApp</label>
      <input type="tel" id="loginPhone" placeholder="5512345678" onkeydown="if(event.key==='Enter')clientLogin()"/>
    </div>
    <div class="gate-field">
      <label>PIN de acceso</label>
      <input type="password" id="loginPin" maxlength="6" placeholder="····" onkeydown="if(event.key==='Enter')clientLogin()"/>
    </div>
    <button class="gate-go" onclick="clientLogin()">Ver mi sitio</button>
    <div class="gate-err" id="loginErr">Datos incorrectos. Contacta a soporte.</div>
    <p style="font-size:11px;color:var(--gray);margin-top:16px">¿No tienes tu PIN? Escríbenos por WhatsApp.</p>
  </div>
</div>

<div class="wrap" id="dashboard">
  <!-- STATS -->
  <div class="stats" id="clientStats"></div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn on" onclick="switchTab('pedidos',this)">Pedidos</button>
    <button class="tab-btn" onclick="switchTab('clientes',this)">Clientes</button>
    <button class="tab-btn" onclick="switchTab('pagos',this)">Pagos</button>
  </div>

  <!-- PEDIDOS -->
  <div id="tab-pedidos"></div>

  <!-- CLIENTES (su info) -->
  <div id="tab-clientes" style="display:none"></div>

  <!-- PAGOS -->
  <div id="tab-pagos" style="display:none"></div>

  <!-- SUPPORT -->
  <a href="https://wa.me/5215573046389?text=Hola%2C%20necesito%20ayuda%20con%20mi%20sitio%20web" class="support-btn" target="_blank">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
    Escribir a soporte
  </a>
</div>

<script>
const SUPABASE_URL='https://rqjsvehqdbgfzjsoqeto.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxanN2ZWhxZGJnZnpqc29xZXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzkzMDMsImV4cCI6MjA5Nzc1NTMwM30.C4S3QuCCo3-X2SSscBBbkL2Y0b9NjlyWE2ErbhZdrRg';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentClient=null, myPayments=[], myOrders=[], myVisits=0;

async function clientLogin(){
  const phone=document.getElementById('loginPhone').value.trim().replace(/\D/g,'');
  const pin=document.getElementById('loginPin').value.trim();
  try{
    const {data:clients}=await sb.from('clients').select('*');
    const client=(clients||[]).find(c=>{
      const cp=(c.phone||'').replace(/\D/g,'');
      return (cp===phone||cp==='52'+phone||'52'+cp===phone)&&(c.pin||'1234')===pin;
    });
    if(client){
      currentClient=client;
      document.getElementById('gate').style.display='none';
      document.getElementById('dashboard').style.display='block';
      document.getElementById('btnLogout').style.display='block';
      sb.from('activity_log').insert({action:'client_login',entity:'clients',entity_id:client.id,details:{name:client.name}});
      await loadClientData();
      render();
    } else {
      document.getElementById('loginErr').style.display='block';
    }
  }catch(err){document.getElementById('loginErr').style.display='block';}
}

function logout(){
  currentClient=null;
  document.getElementById('gate').style.display='flex';
  document.getElementById('dashboard').style.display='none';
  document.getElementById('btnLogout').style.display='none';
  document.getElementById('loginPhone').value='';
  document.getElementById('loginPin').value='';
  document.getElementById('loginErr').style.display='none';
}

async function loadClientData(){
  const c=currentClient;
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const [pay,ord,vis]=await Promise.all([
    sb.from('payments').select('*').eq('client_id',c.id).order('created_at',{ascending:false}),
    sb.from('orders').select('*').eq('phone',c.phone).order('created_at',{ascending:false}),
    sb.from('visits').select('*',{count:'exact',head:true}).eq('client_id',c.id).gte('created_at',monthStart)
  ]);
  myPayments=pay.data||[];
  myOrders=ord.data||[];
  myVisits=vis.count||0;
}

const allTabs=['pedidos','clientes','pagos'];
function switchTab(t,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  allTabs.forEach(x=>{const el=document.getElementById('tab-'+x);if(el)el.style.display=x===t?'block':'none';});
}

function render(){
  const c=currentClient;
  const totalPaid=myPayments.filter(p=>p.status==='pagado').reduce((s,p)=>s+Number(p.amount),0);
  const newOrders=myOrders.filter(o=>o.status==='nuevo').length;

  document.getElementById('clientStats').innerHTML=`
    <div class="stat"><b>${myVisits}</b><span>Visitas</span></div>
    <div class="stat"><b>${myOrders.length}</b><span>Pedidos</span></div>
    <div class="stat"><b>${newOrders}</b><span>Nuevos</span></div>
    <div class="stat"><b>$${totalPaid.toLocaleString()}</b><span>Total pagado</span></div>
  `;

  renderOrders();
  renderClientInfo();
  renderPayments();
}

function renderOrders(){
  const plans={basico:'Básico',profesional:'Profesional',premium:'Premium'};
  const el=document.getElementById('tab-pedidos');
  if(!myOrders.length){el.innerHTML='<div class="empty">Sin pedidos registrados</div>';return;}
  el.innerHTML=myOrders.map(o=>`
    <div class="order-card">
      <span class="badge ${o.status}">${o.status}</span>
      <div class="order-row"><b>Código:</b><span>${o.code||'—'}</span></div>
      <div class="order-row"><b>Cliente:</b><span>${o.name}</span></div>
      <div class="order-row"><b>Estado:</b><span>${o.status}</span></div>
      <div class="order-row"><b>Negocio:</b><span>${o.business||'—'}</span></div>
      <div class="order-row"><b>Teléfono:</b><span>${o.phone||'—'}</span></div>
      <div class="order-row"><b>Tipo:</b><span>${o.type||'—'}</span></div>
      <div class="order-row"><b>Paquete:</b><span>${plans[o.plan]||o.plan||'—'}</span></div>
      ${o.notes?`<div class="order-row"><b>Notas:</b><span>${o.notes}</span></div>`:''}
      <div class="order-date">${fmtDate(o.created_at)}</div>
    </div>
  `).join('');
}

function renderClientInfo(){
  const c=currentClient;
  const plans={basico:'Básico',profesional:'Profesional',premium:'Premium'};
  const prices={basico:'$350',profesional:'$600',premium:'$950'};
  document.getElementById('tab-clientes').innerHTML=`
    <div class="order-card">
      <span class="badge ${c.status}">${c.status}</span>
      <div style="margin-top:12px" class="info-grid">
        <b>Nombre:</b><span>${c.name}</span>
        <b>Negocio:</b><span>${c.business}</span>
        <b>Teléfono:</b><span>${c.phone||'—'}</span>
        <b>Plan:</b><span>${plans[c.plan]||c.plan}</span>
        <b>Renta mensual:</b><span>${prices[c.plan]||'—'} MXN</span>
        <b>Desde:</b><span>${c.start_date?fmtDate(c.start_date):'—'}</span>
        <b>Incluye:</b><span>Hosting, SSL, mantenimiento y soporte</span>
        <b>Respaldos:</b><span>Automáticos — tu sitio siempre está seguro</span>
      </div>
    </div>
  `;
}

function renderPayments(){
  const concepts={setup:'Setup inicial',renta:'Renta mensual',extra:'Servicio extra'};
  const el=document.getElementById('tab-pagos');
  if(!myPayments.length){el.innerHTML='<div class="empty">Sin pagos registrados</div>';return;}
  el.innerHTML=myPayments.map(p=>{
    const now=new Date();
    const st=p.status==='pendiente'&&new Date(p.due_date)<now?'vencido':p.status;
    return `<div class="order-card">
      <span class="badge ${st}">${st}</span>
      <div class="order-row"><b>Concepto:</b><span>${concepts[p.concept]||p.concept}</span></div>
      <div class="order-row"><b>Monto:</b><span style="font-size:20px;font-weight:800">$${Number(p.amount).toLocaleString()}</span></div>
      <div class="order-row"><b>Fecha límite:</b><span>${fmtDate(p.due_date)}</span></div>
      ${p.paid_at?`<div class="order-row"><b>Pagado:</b><span>${fmtDate(p.paid_at)}</span></div>`:''}
    </div>`;
  }).join('');
}

function fmtDate(d){
  if(!d)return '—';
  const dt=new Date(d.includes('T')?d:d+'T12:00:00');
  const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${dt.getDate()} ${m[dt.getMonth()]} ${dt.getFullYear()}`;
}
</script>
</body>
</html>
