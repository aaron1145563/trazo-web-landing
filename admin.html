<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Panel · Trazo Web Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;--bg2:#18181b;--bg3:#27272a;
  --text:#fafafa;--muted:#a1a1aa;--subtle:#71717a;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.12);
  --brand:#3b82f6;--brand-l:#60a5fa;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--cyan:#06b6d4;
  --wa:#25D366;
  --r:12px;--r2:16px;
}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
a{text-decoration:none;color:inherit}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(9,9,11,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.nav-logo svg{width:20px;height:20px}
.nav-logo span{color:var(--muted);font-weight:400;font-size:13px}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-user{font-size:12px;color:var(--muted);font-weight:500}
.nav-out{background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--muted);padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;transition:all .2s;display:none}
.nav-out:hover{background:rgba(255,255,255,.1);color:#fff}

/* GATE */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.gate::before{content:'';position:fixed;top:0;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,.08),transparent 70%);pointer-events:none}
.gate-box{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);padding:40px 32px;width:100%;max-width:380px;text-align:center;position:relative}
.gate-box h2{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.gate-box>p{font-size:13px;color:var(--muted);margin-bottom:28px}
.gate-field{text-align:left;margin-bottom:16px}
.gate-field label{font-size:11px;font-weight:700;color:var(--subtle);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px}
.gate-field input{width:100%;background:var(--bg);border:1.5px solid var(--line2);border-radius:10px;padding:13px 16px;font-size:15px;color:#fff;outline:none;font-family:inherit;transition:border .2s}
.gate-field input:focus{border-color:var(--brand)}
.gate-field input::placeholder{color:var(--subtle)}
.gate-go{width:100%;background:#fff;color:#000;font-size:14px;font-weight:700;padding:14px;border-radius:10px;margin-top:8px;transition:all .2s}
.gate-go:hover{background:var(--brand-l);color:#fff;transform:translateY(-1px)}
.gate-err{color:var(--red);font-size:12px;margin-top:12px;display:none;font-weight:500}

/* WRAP */
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px;display:none}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;text-align:center;transition:border-color .2s}
.stat:hover{border-color:var(--line2)}
.stat b{font-size:32px;font-weight:800;display:block;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,rgba(255,255,255,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat span{font-size:10px;letter-spacing:.12em;color:var(--subtle);text-transform:uppercase;font-weight:600;margin-top:4px;display:block}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* TABS */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--line)}
.tab-btn{background:none;padding:12px 24px;font-size:13px;font-weight:600;color:var(--subtle);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab-btn:hover{color:var(--muted)}
.tab-btn.on{color:var(--brand-l);border-bottom-color:var(--brand);font-weight:700}

/* FILTERS */
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filters input{flex:1;min-width:200px;background:var(--bg2);border:1.5px solid var(--line2);border-radius:10px;padding:11px 16px;font-size:14px;font-family:inherit;color:#fff;outline:none;transition:border .2s}
.filters input::placeholder{color:var(--subtle)}
.filters input:focus{border-color:var(--brand)}
.filters select{background:var(--bg2);border:1.5px solid var(--line2);border-radius:10px;padding:11px 16px;font-size:13px;font-family:inherit;color:#fff;font-weight:600;outline:none}

/* ORDER CARDS */
.order{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:24px;margin-bottom:14px;position:relative;transition:border-color .2s}
.order:hover{border-color:var(--line2)}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.order-code{font-size:20px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.order-acts{display:flex;gap:8px}
.act{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.act svg{width:16px;height:16px}
.act.wa{background:rgba(37,211,102,.15);color:var(--wa)}
.act.wa:hover{background:rgba(37,211,102,.25)}
.act.pr{background:rgba(59,130,246,.1);color:var(--brand-l)}
.act.pr:hover{background:rgba(59,130,246,.2)}
.act.del{background:rgba(239,68,68,.1);color:var(--red)}
.act.del:hover{background:rgba(239,68,68,.2)}

.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:100px}
.badge.nuevo{background:rgba(245,158,11,.12);color:var(--amber)}
.badge.contactado{background:rgba(59,130,246,.12);color:var(--brand-l)}
.badge.en_proceso{background:rgba(6,182,212,.12);color:var(--cyan)}
.badge.completado,.badge.entregado{background:rgba(34,197,94,.12);color:var(--green)}
.badge.cancelado{background:rgba(239,68,68,.12);color:var(--red)}
.badge.activo{background:rgba(34,197,94,.12);color:var(--green)}
.badge.pagado{background:rgba(34,197,94,.12);color:var(--green)}
.badge.pendiente{background:rgba(245,158,11,.12);color:var(--amber)}
.badge.vencido{background:rgba(239,68,68,.12);color:var(--red)}

.o-grid{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px}
.o-grid b{font-weight:600;color:var(--muted)}
.o-grid span{color:var(--text)}
.o-date{font-size:11px;color:var(--subtle);margin-top:10px}

/* STATUS BUTTONS */
.status-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.s-btn{padding:8px 16px;border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;transition:all .2s;background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--line)}
.s-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.s-btn.active{border-color:var(--brand);color:var(--brand-l);background:rgba(59,130,246,.08)}

/* CLIENT INFO CARD */
.info-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:32px;margin-bottom:14px}
.info-card h3{font-size:18px;font-weight:800;margin-bottom:20px;letter-spacing:-.02em}
.info-grid{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;font-size:14px}
.info-grid b{font-weight:600;color:var(--muted)}
.info-grid span{color:var(--text)}

/* PAYMENT CARDS */
.pay-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:24px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.pay-left b{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.pay-left span{font-size:12px;color:var(--subtle)}
.pay-amount{font-size:28px;font-weight:900;letter-spacing:-.02em}

/* EMPTY */
.empty{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:60px 20px;text-align:center;color:var(--subtle);font-size:14px}

/* SITE EDITOR */
.edit-field{margin-bottom:18px}
.edit-field label{font-size:11px;font-weight:700;color:var(--subtle);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
.edit-field input,.edit-field textarea{width:100%;background:var(--bg);border:1.5px solid var(--line2);border-radius:10px;padding:11px 14px;font-size:14px;color:#fff;outline:none;font-family:inherit;transition:border .2s;resize:vertical}
.edit-field input:focus,.edit-field textarea:focus{border-color:var(--brand)}
.edit-row{display:grid;grid-template-columns:1fr 1fr 28px;gap:8px;margin-bottom:8px}
.edit-row-item{grid-template-columns:52px 1fr 1.4fr 70px 28px}
.edit-row input{background:var(--bg);border:1.5px solid var(--line2);border-radius:8px;padding:9px 10px;font-size:13px;color:#fff;outline:none;font-family:inherit}
.edit-row input:focus{border-color:var(--brand)}
.edit-row .w-emoji{text-align:center}
.edit-row-del{background:rgba(239,68,68,.12);color:var(--red);border-radius:8px;font-size:16px;font-weight:700;line-height:1}
.edit-row-del:hover{background:rgba(239,68,68,.22)}
.edit-add{background:rgba(59,130,246,.1);color:var(--brand-l);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;margin-top:4px}
.edit-add:hover{background:rgba(59,130,246,.18)}
@media(max-width:600px){.edit-row-item{grid-template-columns:1fr 28px;grid-template-areas:"icon del" "name name" "desc desc" "price price"}.edit-row-item input:nth-child(1){grid-area:icon}.edit-row-item input:nth-child(2){grid-area:name}.edit-row-item input:nth-child(3){grid-area:desc}.edit-row-item input:nth-child(4){grid-area:price}.edit-row-item .edit-row-del{grid-area:del}}

/* SUPPORT BTN */
.support-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.2);border-radius:var(--r);color:var(--wa);font-weight:700;font-size:14px;margin-top:32px;transition:all .2s}
.support-btn:hover{background:rgba(37,211,102,.15)}
.support-btn svg{width:20px;height:20px;fill:var(--wa)}

@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fi .4s ease}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <div class="nav-logo">
      <svg viewBox="0 0 95 95" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 15 C 20 15, 22 60, 45 75 C 58 83, 70 78, 75 65" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
        <path d="M20 15 L 70 15" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
        <circle cx="75" cy="65" r="5" fill="#3b82f6"/>
      </svg>
      Panel <span>· Trazo Web Studio</span>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <button class="nav-out" id="btnLogout" onclick="logout()">Cerrar sesi&oacute;n</button>
    </div>
  </div>
</nav>

<!-- LOGIN -->
<div class="gate" id="gate">
  <div class="gate-box">
    <h2>Bienvenido</h2>
    <p>Ingresa para ver el estado de tu sitio web</p>
    <div class="gate-field">
      <label>Tu n&uacute;mero de WhatsApp</label>
      <input type="tel" id="loginPhone" placeholder="5512345678" onkeydown="if(event.key==='Enter')document.getElementById('loginPin').focus()"/>
    </div>
    <div class="gate-field">
      <label>Clave de acceso</label>
      <input type="text" id="loginPin" maxlength="6" placeholder="000000" onkeydown="if(event.key==='Enter')clientLogin()"/>
    </div>
    <button class="gate-go" onclick="clientLogin()">Entrar al panel</button>
    <div class="gate-err" id="loginErr">Datos incorrectos. Contacta a soporte.</div>
    <p style="font-size:11px;color:var(--subtle);margin-top:20px">&iquest;No tienes tu clave? <a href="https://wa.me/5215573046389?text=Hola%2C%20necesito%20mi%20clave%20de%20acceso" target="_blank" style="color:var(--brand-l);font-weight:600">Escr&iacute;benos</a></p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="wrap" id="dashboard">
  <div class="stats" id="clientStats"></div>

  <div class="tabs">
    <button class="tab-btn on" onclick="switchTab('pedidos',this)">Pedidos</button>
    <button class="tab-btn" onclick="switchTab('clientes',this)">Mi sitio</button>
    <button class="tab-btn" onclick="switchTab('pagos',this)">Pagos</button>
  </div>

  <div id="tab-pedidos">
    <div class="filters">
      <input id="searchOrders" placeholder="Buscar pedido..." oninput="renderOrders()"/>
      <select id="filterStatus" onchange="renderOrders()">
        <option value="">Todos</option>
        <option value="nuevo">Nuevos</option>
        <option value="contactado">Contactados</option>
        <option value="en_proceso">En proceso</option>
        <option value="completado">Completados</option>
      </select>
    </div>
    <div id="ordersList"></div>
  </div>
  <div id="tab-clientes" style="display:none"></div>
  <div id="tab-pagos" style="display:none"></div>

  <a href="https://wa.me/5215573046389?text=Hola%2C%20necesito%20ayuda%20con%20mi%20sitio%20web" class="support-btn" target="_blank">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 2a10 10 0 00-8.493 15.262L2 22l4.875-1.476A10 10 0 1012 2z"/></svg>
    Escribir a soporte
  </a>
</div>

<script>
const SUPABASE_URL='https://rqjsvehqdbgfzjsoqeto.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxanN2ZWhxZGJnZnpqc29xZXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzkzMDMsImV4cCI6MjA5Nzc1NTMwM30.C4S3QuCCo3-X2SSscBBbkL2Y0b9NjlyWE2ErbhZdrRg';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentClient=null,myPayments=[],myOrders=[],myVisits=0,mySiteContent={};

async function clientLogin(){
  const phone=document.getElementById('loginPhone').value.trim().replace(/\D/g,'');
  const pin=document.getElementById('loginPin').value.trim();
  const btn=document.querySelector('.gate-go');
  btn.textContent='Verificando...';btn.disabled=true;
  try{
    const [{data:clients},{data:orders}]=await Promise.all([
      sb.from('clients').select('*'),
      sb.from('orders').select('phone,code')
    ]);
    const client=(clients||[]).find(c=>{
      const cp=(c.phone||'').replace(/\D/g,'');
      const phoneMatch=cp===phone||cp==='52'+phone||'52'+cp===phone;
      if(!phoneMatch)return false;
      if((c.pin||'1234')===pin)return true;
      return !!(orders||[]).find(o=>(o.phone||'').replace(/\D/g,'')===cp&&o.code===pin);
    });
    if(client){
      currentClient=client;
      document.getElementById('gate').style.display='none';
      document.getElementById('dashboard').style.display='block';
      document.getElementById('btnLogout').style.display='block';
      document.getElementById('navUser').textContent=client.business||client.name;
      sb.from('activity_log').insert({action:'client_login',entity:'clients',entity_id:client.id,details:{name:client.name}});
      await loadClientData();
      render();
    } else {
      document.getElementById('loginErr').style.display='block';
    }
  }catch(err){document.getElementById('loginErr').style.display='block';}
  btn.textContent='Entrar al panel';btn.disabled=false;
}

function logout(){
  currentClient=null;
  document.getElementById('gate').style.display='flex';
  document.getElementById('dashboard').style.display='none';
  document.getElementById('btnLogout').style.display='none';
  document.getElementById('navUser').textContent='';
  document.getElementById('loginPhone').value='';
  document.getElementById('loginPin').value='';
  document.getElementById('loginErr').style.display='none';
}

async function loadClientData(){
  const c=currentClient;
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const [pay,ord,vis,sc]=await Promise.all([
    sb.from('payments').select('*').eq('client_id',c.id).order('created_at',{ascending:false}),
    sb.from('orders').select('*').eq('phone',c.phone).order('created_at',{ascending:false}),
    sb.from('visits').select('*',{count:'exact',head:true}).eq('client_id',c.id).gte('created_at',monthStart),
    sb.from('site_content').select('content').eq('client_id',c.id).maybeSingle()
  ]);
  myPayments=pay.data||[];
  myOrders=(ord.data||[]).filter(o=>o.status!=='rechazado');
  myVisits=vis.count||0;
  mySiteContent=(sc.data&&sc.data.content)||{business_name:c.business||c.name,whatsapp:(c.phone||'').replace(/\D/g,'')};
  if(!Array.isArray(mySiteContent.hours))mySiteContent.hours=[];
  if(!Array.isArray(mySiteContent.items))mySiteContent.items=[];
}

const allTabs=['pedidos','clientes','pagos'];
function switchTab(t,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  allTabs.forEach(x=>{const el=document.getElementById('tab-'+x);if(el)el.style.display=x===t?'block':'none';});
}

function render(){
  const c=currentClient;
  const totalPaid=myPayments.filter(p=>p.status==='pagado').reduce((s,p)=>s+Number(p.amount),0);
  const newOrders=myOrders.filter(o=>o.status==='nuevo').length;
  document.getElementById('clientStats').innerHTML=`
    <div class="stat fade-in"><b>${myVisits}</b><span>Visitas este mes</span></div>
    <div class="stat fade-in" style="animation-delay:.05s"><b>${myOrders.length}</b><span>Pedidos</span></div>
    <div class="stat fade-in" style="animation-delay:.1s"><b>${newOrders}</b><span>Nuevos</span></div>
    <div class="stat fade-in" style="animation-delay:.15s"><b>$${totalPaid.toLocaleString()}</b><span>Total pagado</span></div>
  `;
  renderOrders();
  renderClientInfo();
  renderPayments();
}

function renderOrders(){
  const q=(document.getElementById('searchOrders').value||'').toLowerCase();
  const st=document.getElementById('filterStatus').value;
  const plans={basico:'Básico',profesional:'Premium',premium:'Profesional'};
  let list=myOrders;
  if(q)list=list.filter(o=>(o.name||'').toLowerCase().includes(q)||(o.code||'').includes(q)||(o.business||'').toLowerCase().includes(q));
  if(st)list=list.filter(o=>o.status===st);
  const el=document.getElementById('ordersList');
  if(!list.length){el.innerHTML='<div class="empty">Sin pedidos</div>';return;}
  el.innerHTML=list.map(o=>{
    const tel=(o.phone||'').replace(/\D/g,'');
    const wm=encodeURIComponent('Hola '+o.name+', te contactamos de '+currentClient.business+' sobre tu solicitud '+o.code);
    const statuses=['nuevo','contactado','en_proceso','completado'];
    return `<div class="order fade-in">
      <div class="order-top">
        <div>
          <div class="order-code">${o.code||'—'}</div>
          <span class="badge ${o.status}">${(o.status||'nuevo').replace('_',' ')}</span>
        </div>
        <div class="order-acts">
          ${tel?`<a class="act wa" href="https://wa.me/52${tel}?text=${wm}" target="_blank" title="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 2a10 10 0 00-8.493 15.262L2 22l4.875-1.476A10 10 0 1012 2z"/></svg></a>`:''}
        </div>
      </div>
      <div class="o-grid">
        <b>Cliente</b><span>${o.name}</span>
        <b>Negocio</b><span>${o.business||'—'}</span>
        <b>Tel&eacute;fono</b><span>${o.phone||'—'}</span>
        <b>Tipo</b><span>${o.type||'—'}</span>
        <b>Paquete</b><span>${plans[o.plan]||o.plan||'—'}</span>
        ${o.notes?`<b>Notas</b><span>${o.notes}</span>`:''}
      </div>
      <div class="status-btns">
        ${statuses.map(s=>`<button class="s-btn ${o.status===s?'active':''}" onclick="changeStatus('${o.id}','${s}')">${s.replace('_',' ')}</button>`).join('')}
      </div>
      <div class="o-date">${fmtDate(o.created_at)}</div>
    </div>`;
  }).join('');
}

async function changeStatus(id,status){
  await sb.from('orders').update({status}).eq('id',id);
  const o=myOrders.find(x=>x.id===id);
  if(o)o.status=status;
  renderOrders();
  const newCount=myOrders.filter(o=>o.status==='nuevo').length;
  document.querySelectorAll('.stat')[2].querySelector('b').textContent=newCount;
}

function renderClientInfo(){
  const c=currentClient;
  const plans={basico:'Básico',premium:'Premium',profesional:'Profesional'};
  const prices={basico:'$500',premium:'$650',profesional:'$950'};
  document.getElementById('tab-clientes').innerHTML=`
    <div class="info-card fade-in">
      <h3>Informaci&oacute;n de tu sitio</h3>
      <div style="margin-bottom:12px"><span class="badge ${c.status}">${c.status}</span></div>
      <div class="info-grid">
        <b>Nombre</b><span>${c.name}</span>
        <b>Negocio</b><span>${c.business}</span>
        <b>Tel&eacute;fono</b><span>${c.phone||'—'}</span>
        <b>Plan</b><span>${plans[c.plan]||c.plan}</span>
        <b>Renta mensual</b><span>${prices[c.plan]||'—'} MXN</span>
        <b>Activo desde</b><span>${c.start_date?fmtDate(c.start_date):'—'}</span>
        <b>Incluye</b><span>Hosting, SSL, mantenimiento y soporte</span>
        <b>Respaldos</b><span>Autom&aacute;ticos — tu sitio siempre seguro</span>
        ${c.site_url?`<b>Tu sitio</b><span><a href="${c.site_url}" target="_blank" style="color:var(--brand-l)">${c.site_url}</a></span>`:''}
      </div>
    </div>
    <div id="siteEditor"></div>
  `;
  renderSiteEditor();
}

function renderSiteEditor(){
  const d=mySiteContent;
  const hoursHtml=(d.hours||[]).map((h,i)=>`
    <div class="edit-row" data-idx="${i}">
      <input placeholder="Ej. Lunes a Viernes" value="${(h.label||'').replace(/"/g,'&quot;')}" oninput="mySiteContent.hours[${i}].label=this.value"/>
      <input placeholder="Ej. 9:00 am - 7:00 pm" value="${(h.value||'').replace(/"/g,'&quot;')}" oninput="mySiteContent.hours[${i}].value=this.value"/>
      <button type="button" class="edit-row-del" onclick="removeHourRow(${i})">&times;</button>
    </div>`).join('');
  const itemsHtml=(d.items||[]).map((it,i)=>`
    <div class="edit-row edit-row-item" data-idx="${i}">
      <input class="w-emoji" placeholder="🍽" value="${(it.icon||'').replace(/"/g,'&quot;')}" oninput="mySiteContent.items[${i}].icon=this.value"/>
      <input placeholder="Nombre" value="${(it.name||'').replace(/"/g,'&quot;')}" oninput="mySiteContent.items[${i}].name=this.value"/>
      <input placeholder="Descripción" value="${(it.desc||'').replace(/"/g,'&quot;')}" oninput="mySiteContent.items[${i}].desc=this.value"/>
      <input class="w-price" placeholder="$99" value="${(it.price||'').replace(/"/g,'&quot;')}" oninput="mySiteContent.items[${i}].price=this.value"/>
      <button type="button" class="edit-row-del" onclick="removeItemRow(${i})">&times;</button>
    </div>`).join('');

  document.getElementById('siteEditor').innerHTML=`
    <div class="info-card fade-in">
      <h3>Editar el contenido de tu sitio</h3>
      <p style="font-size:12px;color:var(--subtle);margin:-12px 0 20px">Cambia lo que quieras y da clic en Guardar. Se actualiza directo en tu sitio.</p>

      <div class="edit-field"><label>Nombre del negocio</label><input id="fBizName" value="${(d.business_name||'').replace(/"/g,'&quot;')}"/></div>
      <div class="edit-field"><label>Título principal (puedes usar &lt;span&gt;palabra&lt;/span&gt; para resaltar una palabra)</label><textarea id="fHeroTitle" rows="2">${d.hero_title_html||''}</textarea></div>
      <div class="edit-field"><label>Subtítulo</label><textarea id="fHeroSub" rows="2">${d.hero_subtitle||''}</textarea></div>
      <div class="edit-field"><label>WhatsApp (con código de país, ej. 5215512345678)</label><input id="fWhats" value="${(d.whatsapp||'').replace(/"/g,'&quot;')}"/></div>
      <div class="edit-field"><label>Dirección</label><input id="fAddress" value="${(d.address||'').replace(/"/g,'&quot;')}"/></div>
      <div class="edit-field"><label>Teléfono a mostrar</label><input id="fPhoneDisplay" value="${(d.phone_display||'').replace(/"/g,'&quot;')}"/></div>
      <div class="edit-field"><label>Correo (opcional)</label><input id="fEmail" value="${(d.email||'').replace(/"/g,'&quot;')}"/></div>

      <div class="edit-field">
        <label>Horario</label>
        <div id="hoursRows">${hoursHtml}</div>
        <button type="button" class="edit-add" onclick="addHourRow()">+ Agregar horario</button>
      </div>

      <div class="edit-field">
        <label>Servicios / productos / menú</label>
        <div id="itemsRows">${itemsHtml}</div>
        <button type="button" class="edit-add" onclick="addItemRow()">+ Agregar</button>
      </div>

      <button class="gate-go" style="margin-top:12px" onclick="saveSiteContent()" id="btnSaveSite">Guardar cambios</button>
      <div id="saveMsg" style="font-size:12px;color:var(--green);margin-top:10px;display:none">Guardado ✓</div>
    </div>
  `;
}

function addHourRow(){mySiteContent.hours.push({label:'',value:''});renderSiteEditor();}
function removeHourRow(i){mySiteContent.hours.splice(i,1);renderSiteEditor();}
function addItemRow(){mySiteContent.items.push({icon:'',name:'',desc:'',price:''});renderSiteEditor();}
function removeItemRow(i){mySiteContent.items.splice(i,1);renderSiteEditor();}

async function saveSiteContent(){
  const d=mySiteContent;
  d.business_name=document.getElementById('fBizName').value;
  d.hero_title_html=document.getElementById('fHeroTitle').value;
  d.hero_subtitle=document.getElementById('fHeroSub').value;
  d.whatsapp=document.getElementById('fWhats').value.replace(/\D/g,'');
  d.address=document.getElementById('fAddress').value;
  d.phone_display=document.getElementById('fPhoneDisplay').value;
  d.email=document.getElementById('fEmail').value;
  const btn=document.getElementById('btnSaveSite');
  btn.textContent='Guardando...';btn.disabled=true;
  await sb.from('site_content').upsert({client_id:currentClient.id,business_type:currentClient.business_type||null,content:d},{onConflict:'client_id'});
  btn.textContent='Guardar cambios';btn.disabled=false;
  const msg=document.getElementById('saveMsg');
  msg.style.display='block';
  setTimeout(()=>msg.style.display='none',2500);
}

function renderPayments(){
  const concepts={setup:'Setup inicial',renta:'Renta mensual',extra:'Servicio extra'};
  const el=document.getElementById('tab-pagos');
  if(!myPayments.length){el.innerHTML='<div class="empty">Sin pagos registrados</div>';return;}
  el.innerHTML=myPayments.map(p=>{
    const now=new Date();
    const st=p.status==='pendiente'&&new Date(p.due_date)<now?'vencido':p.status;
    return `<div class="pay-card fade-in">
      <div class="pay-left">
        <b>${concepts[p.concept]||p.concept}</b>
        <span>Vence: ${fmtDate(p.due_date)}${p.paid_at?' · Pagado: '+fmtDate(p.paid_at):''}</span>
      </div>
      <div style="text-align:right">
        <span class="badge ${st}" style="margin-bottom:6px">${st}</span>
        <div class="pay-amount">$${Number(p.amount).toLocaleString()}</div>
      </div>
    </div>`;
  }).join('');
}

function fmtDate(d){
  if(!d)return '—';
  const dt=new Date(d.includes('T')?d:d+'T12:00:00');
  const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${dt.getDate()} ${m[dt.getMonth()]} ${dt.getFullYear()}`;
}
</script>
