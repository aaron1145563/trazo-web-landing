apiVersion: apps/v1
kind: Deployment
metadata:
  name: trazo-web
  labels:
    app: trazo-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trazo-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: trazo-web
    spec:
      containers:
        - name: trazo-web
          image: ghcr.io/aaron1145563/trazo-web-landing:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trazo-web-svc
spec:
  selector:
    app: trazo-web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trazo-web-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: trazoweb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trazo-web-svc
                port:
                  number: 80
  tls:
    - hosts:
        - trazoweb.com
      secretName: trazo-web-tls
